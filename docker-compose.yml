version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: matchbar-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - matchbar-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: matchbar

  api:
    build: ./backend
    container_name: matchbar-api
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      MONGODB_URI: mongodb://mongo:27017/matchbar
      JWT_SECRET: cambia-esta-clave-en-produccion-debe-ser-larga-min-256-bits-1234567890
    ports:
      - "8080:8080"

volumes:
  matchbar-mongo-data:
