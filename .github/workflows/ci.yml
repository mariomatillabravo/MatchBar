name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Si llegan varios pushes seguidos a la misma rama/PR, solo cuenta el último.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compilación y tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = compilar + tests. No necesita MongoDB (los tests usan mocks).
      - run: ./mvnw -B verify

  android:
    name: Android (build debug y release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      # Comprueba que gradle-wrapper.jar es el oficial de Gradle.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # El runner ya trae el Android SDK (ANDROID_HOME).
      - run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      # Release con R8 (sin firmar): detecta a tiempo reglas de ofuscación rotas
      # o clases que faltan. La URL es ficticia; solo tiene que ser https.
      - run: ./gradlew --no-daemon assembleRelease -Pmatchbar.releaseApiUrl=https://api.matchbar.invalid/

  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # historial completo: un secreto borrado sigue en commits antiguos
      - name: Instalar gitleaks (versión fijada y verificada)
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      # Hallazgos ya rotados del historial: .gitleaksignore
      - run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner
