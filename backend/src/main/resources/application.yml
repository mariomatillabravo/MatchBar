spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/matchbar}
      # Necesario para que se creen los índices declarados con anotaciones
      # (en especial el 2dsphere de Bar.location, sin el cual $geoNear falla).
      auto-index-creation: true
  jpa:
    open-in-view: false
  servlet:
    multipart:
      # Por defecto Spring limita la subida a 1 MB/archivo, lo que hace fallar
      # (500) la subida de fotos del bar y la carta. Subimos el límite a un
      # tamaño razonable para imágenes desde el móvil.
      max-file-size: 15MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    # Los mensajes de error de la API los genera GlobalExceptionHandler; aquí
    # evitamos que la página /error de Spring exponga detalles internos.
    include-message: never

# Los secretos llegan SIEMPRE por variables de entorno (ver .env.example en la
# raíz). No tienen valor por defecto: si faltan, la API no arranca o la
# funcionalidad se desactiva con un aviso en el log.
matchbar:
  jwt:
    # Obligatorio, mínimo 32 bytes. Genera uno con: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-ms: 3600000  # 1 hora

  # Primer administrador en entornos sin datos de prueba (ver AdminBootstrap).
  # Solo se usa si todavía no existe ningún ADMIN.
  bootstrap-admin:
    email: ${MATCHBAR_ADMIN_EMAIL:}
    password: ${MATCHBAR_ADMIN_PASSWORD:}

  football:
    enabled: ${FOOTBALL_SYNC_ENABLED:true}
    # Sin API key la sincronización queda desactivada (FootballProperties#isActive).
    api-key: ${FOOTBALL_API_KEY:}
    base-url: https://api.football-data.org/v4
    competition-codes: PD,PL,CL,BL1,SA,WC
    sync-days-ahead: 15
    sync-interval-ms: 43200000  # 12 horas

  geocoding:
    # Nominatim (OpenStreetMap): geocodificación gratuita y sin API key.
    base-url: https://nominatim.openstreetmap.org/search
    # Nominatim exige un User-Agent identificable (si no, devuelve 403).
    user-agent: MatchBar/1.0 (https://github.com/titofp/matchbar)
    # Sesga los resultados a un país (códigos ISO separados por coma). Vacío = mundial.
    country-codes: es

springdoc:
  swagger-ui:
    path: /swagger-ui.html
